<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Telecom Dashboard</title>
    <script type="module" crossorigin src="/assets/index-DZi4P_7i.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CbE-LtKC.css">
  </head>
  <body>
    <div id="app">
      <div class="sidebar glass">
        <h1>Telecom Dashboard</h1>
        <form id="session-auth" autocomplete="off">
          <label for="session-token">Token HTTP de session</label>
          <input id="session-token" type="password" autocomplete="off" maxlength="1024" placeholder="TELECOM_HTTP_TOKEN" />
          <button class="speedtest-btn" type="submit">Appliquer</button>
          <button class="speedtest-btn" id="clear-token" type="button">Effacer la session</button>
          <small>En mémoire uniquement. Requis pour les mutations et tout accès distant.</small>
          <p id="auth-status" role="status" aria-live="polite">Lecture locale sans token.</p>
        </form>
        
        <div class="stat-card">
          <h3>Network Nodes</h3>
          <p id="stat-nodes">0</p>
        </div>
        
        <div class="stat-card">
          <h3>Cables & Edges</h3>
          <p id="stat-edges">0</p>
        </div>

        <div class="legend">
          <h3>Legend</h3>
          <div class="legend-item"><span class="dot server"></span> Server</div>
          <div class="legend-item"><span class="dot router"></span> Router</div>
          <div class="legend-item"><span class="dot antenna"></span> Antenna</div>
          <div class="legend-item"><span class="dot nro"></span> NRO</div>
          <div class="legend-item"><span class="dot nra"></span> NRA</div>
          <div class="legend-item"><span class="dot pm"></span> PM</div>
          <div class="legend-item"><span class="dot sr"></span> SR</div>
        </div>

        <div class="coverage-controls">
          <h3>Affichage</h3>
          <div class="coverage-toggles">
            <label class="toggle-label"><input type="checkbox" id="cov-nperf" class="layer-checkbox" data-tech="nperf" checked> <span class="slider"></span> Nperf (Global)</label>
            <label class="toggle-label"><input type="checkbox" id="show-infra" class="layer-checkbox" checked> <span class="slider"></span> Infrastructure</label>
          </div>
        </div>
      </div>
      
      <div class="map-container">
        <canvas id="network-map"></canvas>
        <div id="tooltip" class="glass-tooltip" style="display: none;"></div>
      </div>

      <div id="details-panel" class="details-panel glass" style="display: none;">
        <div class="details-header">
          <h2 id="details-title">Element Details</h2>
          <button id="details-close">&times;</button>
        </div>
        <div id="details-content" class="details-content">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </body>
</html>
