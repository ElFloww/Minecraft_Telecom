name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix web-dashboard

      - name: Test and build dashboard
        run: npm --prefix web-dashboard run check && npm --prefix web-dashboard test && npm --prefix web-dashboard run build

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run world integration tests
        run: ./gradlew runGameTestServer
